name: Feature request
description: Suggest a change to a scratch or DJ workflow.
title: "[Feature] "
body:
  - type: input
    id: version
    attributes:
      label: SKRATCH.EXE version, format, DAW and Windows
  - type: input
    id: hardware
    attributes:
      label: Relevant audio driver, buffer or controller
  - type: textarea
    id: workflow
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Desired behavior and a concrete example
    validations:
      required: true
